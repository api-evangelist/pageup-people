name: PageUp People
description: >-
  PageUp is an enterprise talent management and talent acquisition software
  provider headquartered in Melbourne, Australia, serving large organizations
  across government, healthcare, higher education, retail, and other sectors.
  The PageUp platform spans recruitment marketing, applicant tracking (ATS),
  onboarding, performance and development, learning, succession, and workforce
  analytics. PageUp exposes a REST API suite for clients and integration
  partners covering Core HR (employees, positions, business units, cost centres,
  agreements, pay scales, roles, sites, teams), Recruitment (applicants,
  applications, documents, hire), Partner endpoints (learning activities, SCORM
  content, assessment, background checking, work compliance), Performance
  (review reports), and Platform functions (data exports). The API is secured
  with OAuth 2.0 client-credentials, is documented at developers.pageuppeople.com
  with a Postman workspace and API release logs, and provisions a UAT sandbox
  environment; per-tenant API domains are provisioned by PageUp for each client.
