authentication:
  style: oauth2
  flow: clientCredentials
  detail: >-
    OAuth 2.0 client-credentials; client id/secret issued by PageUp per tenant
    (UAT first, then production). See authentication/pageup-people-authentication.yml
base_url:
  style: per-tenant
  detail: >-
    PageUp provisions a target domain for API requests per client tenant; there
    is no single public base URL.
error_envelope:
  format: custom-json-array
  detail: >-
    Array of {message, field?} objects (not RFC 9457). See
