  documented: false
  detail: No idempotency key/header is documented in the public developer portal.
pagination:
  documented: false
  detail: Pagination conventions are not documented in the public getting-started material.
versioning:
  documented: partial
  detail: >-
    PageUp publishes API Release Logs for updates; a formal version scheme is not
    published in the public getting-started material.
